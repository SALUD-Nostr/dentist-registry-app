---
- name: Build and Deploy Dental Intake to Cloudflare Pages
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    app_name: "dental_intake"
    app_dir: "{{ playbook_dir }}/../{{ app_name }}"
    project_root: "{{ playbook_dir }}/.."
    cloudflare_project_name: "salud-registry"
    # Override these via command line or vars file:
    # ansible-playbook deploy-dental-intake.yml -e "cloudflare_account_id=YOUR_ACCOUNT_ID"
    cloudflare_account_id: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_ID') }}"
    cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"

  tasks:
    - name: Validate Cloudflare credentials
      fail:
        msg: "Missing Cloudflare credentials. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN environment variables."
      when: cloudflare_account_id == "" or cloudflare_api_token == ""

    - name: Check if Rust is installed
      command: rustc --version
      register: rust_check
      ignore_errors: yes
      changed_when: false

    - name: Install Rust (if not present)
      shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source $HOME/.cargo/env
      args:
        creates: "{{ ansible_env.HOME }}/.cargo/bin/rustc"
      when: rust_check.failed

    - name: Add wasm32-unknown-unknown target
      command: rustup target add wasm32-unknown-unknown
      changed_when: false

    - name: Check if Trunk is installed
      command: trunk --version
      register: trunk_check
      ignore_errors: yes
      changed_when: false

    - name: Install Trunk
      command: cargo install --locked trunk
      when: trunk_check.failed

    - name: Check if Node.js is installed
      command: node --version
      register: node_check
      ignore_errors: yes
      changed_when: false

    - name: Install Node.js (Ubuntu/Debian)
      apt:
        name: nodejs
        state: present
      become: yes
      when:
        - node_check.failed
        - ansible_os_family == "Debian"

    - name: Install Node.js (Fedora/RHEL)
      dnf:
        name: nodejs
        state: present
      become: yes
      when:
        - node_check.failed
        - ansible_os_family == "RedHat"

    - name: Check if npm is installed
      command: npm --version
      register: npm_check
      ignore_errors: yes
      changed_when: false

    - name: Install npm (Ubuntu/Debian)
      apt:
        name: npm
        state: present
      become: yes
      when:
        - npm_check.failed
        - ansible_os_family == "Debian"

    - name: Install npm (Fedora/RHEL)
      dnf:
        name: npm
        state: present
      become: yes
      when:
        - npm_check.failed
        - ansible_os_family == "RedHat"

    - name: Check if Tailwind CSS is installed globally
      command: which tailwindcss4
      register: tailwind_check
      ignore_errors: yes
      changed_when: false

    - name: Install Tailwind CSS 4
      npm:
        name: tailwindcss
        version: "4.0.0"
        global: yes
        state: present
      become: yes
      when: tailwind_check.failed

    - name: Check if wrangler is installed
      command: wrangler --version
      register: wrangler_check
      ignore_errors: yes
      changed_when: false

    - name: Install wrangler
      npm:
        name: wrangler
        global: yes
        state: present
      become: yes
      when: wrangler_check.failed

    - name: Get current git branch
      command: git rev-parse --abbrev-ref HEAD
      args:
        chdir: "{{ project_root }}"
      register: git_branch
      changed_when: false

    - name: Display deployment branch
      debug:
        msg: "Deploying from branch: {{ git_branch.stdout }}"

    - name: Clean previous build artifacts
      file:
        path: "{{ app_dir }}/dist"
        state: absent

    - name: Build Tailwind CSS styles
      command: tailwindcss4 -i input.css -o output.css --minify
      args:
        chdir: "{{ app_dir }}"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:{{ ansible_env.HOME }}/.cargo/bin"

    - name: Build application with Trunk
      command: trunk build --release
      args:
        chdir: "{{ app_dir }}"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:{{ ansible_env.HOME }}/.cargo/bin"

    - name: Verify dist directory exists
      stat:
        path: "{{ app_dir }}/dist"
      register: dist_dir

    - name: Fail if dist directory doesn't exist
      fail:
        msg: "Build failed - dist directory not found"
      when: not dist_dir.stat.exists

    - name: Deploy to Cloudflare Pages
      command: >
        wrangler pages deploy dist
        --project-name={{ cloudflare_project_name }}
        --branch={{ git_branch.stdout }}
      args:
        chdir: "{{ app_dir }}"
      environment:
        CLOUDFLARE_ACCOUNT_ID: "{{ cloudflare_account_id }}"
        CLOUDFLARE_API_TOKEN: "{{ cloudflare_api_token }}"
      register: deploy_result

    - name: Display deployment result
      debug:
        msg: "{{ deploy_result.stdout_lines }}"

    - name: Display deployment URL
      debug:
        msg: "Application deployed successfully! Check Cloudflare Pages dashboard for URL."
