[package]
name = "dental_intake"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
production = []

[dependencies]
# Core dependencies
salud-types = { path = "../salud-types" }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Storage
idb = "0.6.4"

# Web APIs
web-sys = { version = "0.3.77", features = ["CssStyleDeclaration", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "Window", "Document"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Error handling
thiserror = "2.0"

# Utils
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
gloo-console = "0.3"
shady-minions = "0.1.5"
yew-full-calendar = "0.1.1"
nostr-minions = "0.1.25"

[dev-dependencies]
wasm-bindgen-test = "0.3"
